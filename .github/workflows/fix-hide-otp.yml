name: Hide OTP from email
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_hide_email_otp.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/_lib/mailer.js api/auth/login.js api/auth/callback.js
          git commit -m "feat(auth): hide OTP from email; reveal only after no-redirect" || echo "no changes"
          git push origin HEAD:main

name: Tech UI
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_tech_ui.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/style.css
          git commit -m "ui: tech aesthetic for weather home (cyan glass, mono numbers)" || echo "no changes"
          git push origin HEAD:main

name: More bold label
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_more_bold_label.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js public/style.css
          git commit -m "ui(auth): more login bold white, label 顯示較少" || echo "no changes"
          git push origin HEAD:main

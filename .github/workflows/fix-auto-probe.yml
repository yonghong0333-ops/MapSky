name: Auto device probe
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_auto_device_probe.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/auth/callback.js
          git commit -m "feat(auth): auto probe same-device via mapsky:// then enable OTP" || echo "no changes"
          git push origin HEAD:main

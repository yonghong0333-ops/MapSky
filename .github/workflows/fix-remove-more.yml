name: Remove more toggle
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_remove_more_toggle.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js
          git commit -m "ui: remove blue more/collapse toggle; show all login providers" || echo "no changes"
          git push origin HEAD:main

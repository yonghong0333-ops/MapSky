name: More login anim
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_more_login_anim.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js public/style.css
          git commit -m "ui(auth): animate expand/collapse of more login methods" || echo "no changes"
          git push origin HEAD:main

name: Fix magic row border
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_magic_row_border.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/style.css
          git commit -m "ui(auth): single border on email row, remove double ring" || echo "no changes"
          git push origin HEAD:main

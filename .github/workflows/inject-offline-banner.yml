name: inject-offline-banner
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inject-offline-banner.yml'
      - 'public/offline-banner.js'
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject script tag
        run: |
          set -e
          if grep -q 'offline-banner.js' public/index.html; then
            echo "already injected"
          else
            # insert after sun-moon-detail.js if present, else after chart-polish / web-shim
            if grep -q 'sun-moon-detail.js' public/index.html; then
              sed -i 's|<script src="sun-moon-detail.js"></script>|<script src="sun-moon-detail.js"></script>\n<script src="offline-banner.js"></script>|' public/index.html
            elif grep -q 'chart-polish.js' public/index.html; then
              sed -i 's|<script src="chart-polish.js"></script>|<script src="chart-polish.js"></script>\n<script src="offline-banner.js"></script>|' public/index.html
            else
              sed -i 's|<script src="web-shim.js"></script>|<script src="web-shim.js"></script>\n<script src="offline-banner.js"></script>|' public/index.html
            fi
            echo "injected"
          fi
          grep -n 'offline-banner' public/index.html || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/offline-banner.js
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "ui: inject offline-banner.js script tag"
            git push
          fi

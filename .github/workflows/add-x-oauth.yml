name: Add X OAuth
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_x_oauth.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/_lib/providers.js api/auth/login.js api/auth/callback.js public/web-shim.js public/login-icons/x.png .env.example
          git commit -m "feat(auth): add X OAuth under more login methods" || echo "no changes"
          git push origin HEAD:main

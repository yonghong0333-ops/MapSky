name: Weather boot animation
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_weather_boot.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css public/web-shim.js
          git commit -m "ui: cycle weather icons (sun/cloud/rain) on login boot" || echo "no changes"
          git push origin HEAD:main

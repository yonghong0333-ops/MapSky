name: Apply verify screen
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_verify_screen.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css public/web-shim.js
          git status
          git commit -m "feat(login): 寄出 Email 登入連結後顯示驗證畫面" || echo "no changes"
          git push origin HEAD:main

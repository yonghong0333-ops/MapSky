name: mapskyweb-base-path
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mapskyweb-base-path.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch web-shim base path for mapskyweb
        run: |
          echo "" | base64 -d > /tmp/patch_shim.py
          python3 /tmp/patch_shim.py
      - name: Commit
        run: |
          git config user.name mapsky-bot
          git config user.email bot@mapsky.local
          git add public/web-shim.js web-shim.js 2>/dev/null || true
          git status
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "fix(web): mapskyweb /app base path for post-login redirects"
          git push

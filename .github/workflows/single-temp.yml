name: single-temp
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/single-temp.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('public/renderer.js')
          js = p.read_text(encoding='utf-8')
          if 'el("currentTemp").textContent = `${maxNow}°C`' in js:
              print('already')
          else:
              a = 'el("currentTemp").textContent = `${minNow}–${maxNow}°C`;'
              b = 'el("currentTemp").textContent = `${maxNow}°C`;'
              if a not in js:
                  raise SystemExit('temp line missing')
              js = js.replace(a, b, 1)
              # JS source has literal backslash-n inside template string
              c2 = '舒適度 ${ciNow}' + chr(92) + 'n降雨機率 ${popNow}%' + chr(92) + 'n資料來源：中央氣象署'
              d2 = '舒適度 ${ciNow}' + chr(92) + 'n溫度 ${minNow}–${maxNow}°C' + chr(92) + 'n資料來源：中央氣象署'
              if c2 not in js:
                  raise SystemExit('detail missing')
              js = js.replace(c2, d2, 1)
              p.write_text(js, encoding='utf-8')
              print('patched ok')
          PY
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/renderer.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ui: single current temp; range under comfort"
            git push
          fi

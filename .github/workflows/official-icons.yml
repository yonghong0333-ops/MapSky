name: Official icons
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_official_icons.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js public/login-icons/x.png
          git commit -m "ui(auth): official Google/X PNG icons for native glass" || echo "no changes"
          git push origin HEAD:main

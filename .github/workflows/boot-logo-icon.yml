name: boot-logo-icon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/boot-logo-icon.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch boot icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          idx = Path('public/index.html')
          h = idx.read_text(encoding='utf-8')
          if 'login-gate-boot-logo" src="icons/icon-192.png"' in h:
              print('index already')
          else:
              pat = re.compile(
                  r'<div class="login-gate-boot-weather">[\s\S]*?</div>\s*</div>\s*<p class="login-gate-boot-text"',
                  re.M,
              )
              m = pat.search(h)
              if not m:
                  raise SystemExit('weather block not found')
              repl = (
                  '<div class="login-gate-boot-weather">\n'
                  '          <img class="login-gate-boot-wx is-active login-gate-boot-logo" '
                  'src="icons/icon-192.png" alt="MapSky" />\n'
                  '        </div>\n      </div>\n'
                  '      <p class="login-gate-boot-text"'
              )
              h = h[:m.start()] + repl + h[m.end():]
              idx.write_text(h, encoding='utf-8')
              print('index ok')

          cb = Path('api/auth/callback.js')
          c = cb.read_text(encoding='utf-8')
          if '/icons/icon-192.png' in c:
              print('callback already has icon')
          else:
              c2 = c.replace(
                  '<div class="orbit" aria-hidden="true"><span class="ring"></span><div class="sun"></div></div>',
                  '<div class="orbit" aria-hidden="true"><span class="ring"></span>'
                  '<img class="logo" src="/icons/icon-192.png" alt="MapSky" width="52" height="52"/></div>',
              )
              if c2 == c:
                  print('callback orbit not found')
              else:
                  c = c2
                  c = c.replace(
                      '.sun{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe566,#f5a623);box-shadow:0 0 20px rgba(255,200,50,0.55)}\n  .sun:after{content:"";position:absolute;inset:-10px;background:repeating-conic-gradient(from 0deg,#f5a623 0 8deg,transparent 8deg 30deg);border-radius:50%;opacity:0.85;z-index:-1}',
                      '.logo{width:52px;height:52px;border-radius:14px;object-fit:contain;position:relative;z-index:1;'
                      'box-shadow:0 4px 14px rgba(30,60,120,0.2)}',
                  )
                  cb.write_text(c, encoding='utf-8')
                  print('callback ok')

          css_path = Path('public/style.css')
          css = css_path.read_text(encoding='utf-8')
          if 'BOOT_LOGO_ICON' not in css:
              css = css.rstrip() + '''

/* BOOT_LOGO_ICON */
.login-gate-boot-weather .login-gate-boot-logo {
  width: 72px !important;
  height: 72px !important;
  border-radius: 18px !important;
  opacity: 1 !important;
  transform: none !important;
  object-fit: contain !important;
  filter: drop-shadow(0 6px 16px rgba(30, 60, 120, 0.22));
}
.login-gate-boot-weather {
  width: 72px !important;
  height: 72px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}
'''
              css_path.write_text(css, encoding='utf-8')
              print('css ok')
          else:
              print('css already')
          PY
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css api/auth/callback.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ui: login boot spinner uses MapSky app icon"
            git push
          fi

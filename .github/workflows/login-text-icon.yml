name: Login text white icon
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_login_text_icon.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css public/web-shim.js public/login-icons/google.png || true
          git commit -m "ui(auth): white terminal text, tagline type, Google icon" || echo "no changes"
          git push origin HEAD:main

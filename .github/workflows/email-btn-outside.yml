name: Email btn outside
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_email_btn_outside.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/style.css
          git commit -m "ui(auth): email submit outside input on the right" || echo "no changes"
          git push origin HEAD:main

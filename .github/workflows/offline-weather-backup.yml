name: offline-weather-backup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/offline-weather-backup.yml'
      - 'scripts/patch_offline_weather.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer.js
        run: python3 scripts/patch_offline_weather.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/renderer.js
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "feat: auto backup weather data for offline use"
            git push
          fi

name: Remove sunrise sunset from boot
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_remove_sunrise_sunset.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html
          git commit -m "ui: remove sunrise/sunset from login boot weather cycle" || echo "no changes"
          git push origin HEAD:main

name: web-return-xchg
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/web-return-xchg.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch callback.js
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path("api/auth/callback.js")
          t = p.read_text(encoding="utf-8")
          if "webReturn" in t and "oauth_return" in t and "官網 return_to" in t:
              print("already patched")
              raise SystemExit(0)

          if 'serializeCookie("oauth_return"' not in t:
              needle = 'serializeCookie("oauth_desktop", "", { maxAge: 0 }),\n    ];'
              insert = 'serializeCookie("oauth_desktop", "", { maxAge: 0 }),\n      serializeCookie("oauth_return", "", { maxAge: 0 }),\n    ];'
              if needle not in t:
                  raise SystemExit("clear cookies needle missing")
              t = t.replace(needle, insert, 1)
              print("cleared oauth_return")

          marker = 'res.writeHead(302, { Location: "/?login=success" });'
          # Only patch the OAuth success one after nexora_session token set (not magic-link webUrl)
          key = '''    res.setHeader("Set-Cookie", [
      serializeCookie("nexora_session", token, { maxAge: 60 * 60 * 24 * 7 }),
      ...clearFlowCookies,
    ]);
    res.writeHead(302, { Location: "/?login=success" });
    res.end();'''
          if key not in t:
              raise SystemExit("oauth success key missing")

          block = '''    // 官網 return_to：發 xchg 導回官網
    const retRaw = String(parseCookies(req).oauth_return || "").trim();
    let webReturn = "";
    if (retRaw) {
      try {
        const u = new URL(retRaw);
        const allowed = (
          u.hostname === "mapskyweb.vercel.app" ||
          u.hostname.endsWith(".mapskyweb.vercel.app") ||
          u.hostname === "localhost" ||
          u.hostname === "127.0.0.1"
        );
        if (allowed) webReturn = u.origin + u.pathname + (u.search || "");
      } catch (_) {}
    }
    if (webReturn) {
      try {
        const xchg = await storeExchangeCode(token);
        const join = webReturn.includes("?") ? "&" : "?";
        const loc = webReturn + join + "xchg=" + encodeURIComponent(xchg) + "&login=success";
        res.setHeader("Set-Cookie", clearFlowCookies);
        res.writeHead(302, { Location: loc });
        res.end();
        return;
      } catch (e) {
        console.error("web return xchg failed", e.message);
      }
    }

    res.setHeader("Set-Cookie", [
      serializeCookie("nexora_session", token, { maxAge: 60 * 60 * 24 * 7 }),
      ...clearFlowCookies,
    ]);
    res.writeHead(302, { Location: "/?login=success" });
    res.end();'''
          t = t.replace(key, block, 1)
          p.write_text(t, encoding="utf-8")
          print("patched", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name mapsky-bot
          git config user.email bot@mapsky.local
          git add api/auth/callback.js
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "feat(auth): OAuth return_to xchg back to mapskyweb"
          git push

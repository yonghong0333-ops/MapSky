name: patch-x-logo
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch X logo to official SVG
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("public/web-shim.js")
          t = p.read_text(encoding="utf-8")
          # remove x png from PROVIDER_ICON
          t2, n1 = re.subn(r'\n\s*x:\s*"login-icons/x\.png",\s*', '\n', t, count=1)
          if n1 != 1:
              raise SystemExit(f"x.png line not found n={n1}")
          t = t2
          # dark fill for light glass buttons
          t2, n2 = re.subn(
              r'(const X_SVG = `<svg[^>]*fill=")#ffffff(")',
              r'\1#0f172a\2',
              t,
              count=1,
          )
          if n2 != 1:
              raise SystemExit(f"X_SVG fill not found n={n2}")
          t = t2
          # prefer X_SVG before PROVIDER_ICON img
          old = (
              'if (PROVIDER_ICON[p.id]) {\n'
              '          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;\n'
              '        } else if (p.id === "google") {\n'
              '          icon = GOOGLE_SVG;\n'
              '        } else if (p.id === "x" && typeof X_SVG !== "undefined") {\n'
              '          icon = X_SVG;\n'
              '        }'
          )
          new = (
              'if (p.id === "x" && typeof X_SVG !== "undefined") {\n'
              '          icon = X_SVG;\n'
              '        } else if (PROVIDER_ICON[p.id]) {\n'
              '          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;\n'
              '        } else if (p.id === "google") {\n'
              '          icon = GOOGLE_SVG;\n'
              '        }'
          )
          if old not in t:
              # try flexible whitespace
              pat = re.compile(
                  r'if \(PROVIDER_ICON\[p\.id\]\) \{\s*'
                  r'icon = `<img src="\$\{PROVIDER_ICON\[p\.id\]\}" alt="" width="18" height="18" />`;\s*'
                  r'\} else if \(p\.id === "google"\) \{\s*'
                  r'icon = GOOGLE_SVG;\s*'
                  r'\} else if \(p\.id === "x" && typeof X_SVG !== "undefined"\) \{\s*'
                  r'icon = X_SVG;\s*'
                  r'\}'
              )
              m = pat.search(t)
              if not m:
                  raise SystemExit("buildGateButtons block missing")
              t = t[:m.start()] + new + t[m.end():]
          else:
              t = t.replace(old, new, 1)
          p.write_text(t, encoding="utf-8")
          print("patched ok")
          assert 'login-icons/x.png' not in Path("public/web-shim.js").read_text() or True
          print("x.png still referenced?", "login-icons/x.png" in Path("public/web-shim.js").read_text())
          print("dark fill?", '#0f172a' in Path("public/web-shim.js").read_text())
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/web-shim.js
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ui: OAuth login use official X logo SVG"
          git push

name: patch-x-logo
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch X logo to official SVG
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("public/web-shim.js")
          t = p.read_text(encoding="utf-8")
          old_icon = '''  const PROVIDER_ICON = {
            google: "login-icons/google.png",
            x: "login-icons/x.png",
            facebook: "login-icons/facebook.png",
            microsoft: "login-icons/microsoft.png",
            discord: "login-icons/discord.png",
            github: "login-icons/github.png",
            yahoo: "login-icons/yahoo.png",
          };'''
          new_icon = '''  const PROVIDER_ICON = {
            google: "login-icons/google.png",
            # x uses official X_SVG
            facebook: "login-icons/facebook.png",
            microsoft: "login-icons/microsoft.png",
            discord: "login-icons/discord.png",
            github: "login-icons/github.png",
            yahoo: "login-icons/yahoo.png",
          };'''
          # fix: comments in JS block must be //
          new_icon = '''  const PROVIDER_ICON = {
            google: "login-icons/google.png",
            // x 使用官方 SVG（見 X_SVG），不用 png
            facebook: "login-icons/facebook.png",
            microsoft: "login-icons/microsoft.png",
            discord: "login-icons/discord.png",
            github: "login-icons/github.png",
            yahoo: "login-icons/yahoo.png",
          };'''
          if old_icon not in t:
              raise SystemExit("PROVIDER_ICON block missing")
          t = t.replace(old_icon, new_icon, 1)
          t = t.replace(
              'const X_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="#ffffff"',
              'const X_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="#0f172a"',
              1,
          )
          old_build = '''        if (PROVIDER_ICON[p.id]) {
            icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;
          } else if (p.id === "google") {
            icon = GOOGLE_SVG;
          } else if (p.id === "x" && typeof X_SVG !== "undefined") {
            icon = X_SVG;
          }'''
          new_build = '''        if (p.id === "x" && typeof X_SVG !== "undefined") {
            icon = X_SVG;
          } else if (PROVIDER_ICON[p.id]) {
            icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;
          } else if (p.id === "google") {
            icon = GOOGLE_SVG;
          }'''
          if old_build not in t:
              raise SystemExit("buildGateButtons block missing")
          t = t.replace(old_build, new_build, 1)
          p.write_text(t, encoding="utf-8")
          print("patched ok")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/web-shim.js
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "ui: OAuth login use official X logo SVG"
          git push

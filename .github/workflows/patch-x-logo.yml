name: patch-x-logo
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('public/web-shim.js')
          t = p.read_text(encoding='utf-8')
          print('has x.png', 'login-icons/x.png' in t)
          t = t.replace('    x: \"login-icons/x.png\",\n', '')
          t = t.replace('fill=\"#ffffff\" aria-hidden=\"true\"><path d=\"M18.244', 'fill=\"#0f172a\" aria-hidden=\"true\"><path d=\"M18.244', 1)
          old = 'if (PROVIDER_ICON[p.id]) {\n          icon = \`<img src=\"\${PROVIDER_ICON[p.id]}\" alt=\"\" width=\"18\" height=\"18\" />\`;\n        } else if (p.id === \"google\") {\n          icon = GOOGLE_SVG;\n        } else if (p.id === \"x\" && typeof X_SVG !== \"undefined\") {\n          icon = X_SVG;\n        }'
          new = 'if (p.id === \"x\" && typeof X_SVG !== \"undefined\") {\n          icon = X_SVG;\n        } else if (PROVIDER_ICON[p.id]) {\n          icon = \`<img src=\"\${PROVIDER_ICON[p.id]}\" alt=\"\" width=\"18\" height=\"18\" />\`;\n        } else if (p.id === \"google\") {\n          icon = GOOGLE_SVG;\n        }'
          print('old in t', old in t)
          if old in t:
              t = t.replace(old, new, 1)
          else:
              raise SystemExit('build block missing')
          p.write_text(t, encoding='utf-8')
          print('done', 'login-icons/x.png' in t, '#0f172a' in t)
          "
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/web-shim.js
          git diff --cached --stat
          git commit -m "ui: OAuth login use official X logo SVG" || echo no-op
          git push

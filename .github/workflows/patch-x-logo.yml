name: patch-x-logo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore web-shim and apply official X SVG
        run: |
          set -e
          GOOD=$(git log --all --pretty=format:%H -- public/web-shim.js | while read c; do
            sz=$(git cat-file -s "$c:public/web-shim.js" 2>/dev/null || echo 0)
            if [ "$sz" -gt 50000 ]; then echo "$c"; break; fi
          done)
          echo "GOOD=$GOOD"
          test -n "$GOOD"
          git show "$GOOD:public/web-shim.js" > public/web-shim.js
          wc -c public/web-shim.js
          python3 << 'PY'
          from pathlib import Path
          p = Path("public/web-shim.js")
          t = p.read_text(encoding="utf-8")
          t = t.replace('    x: "login-icons/x.png",\n', '')
          t = t.replace(
              'fill="#ffffff" aria-hidden="true"><path d="M18.244',
              'fill="#0f172a" aria-hidden="true"><path d="M18.244',
              1,
          )
          old = (
              'if (PROVIDER_ICON[p.id]) {\n'
              '          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;\n'
              '        } else if (p.id === "google") {\n'
              '          icon = GOOGLE_SVG;\n'
              '        } else if (p.id === "x" && typeof X_SVG !== "undefined") {\n'
              '          icon = X_SVG;\n'
              '        }'
          )
          new = (
              'if (p.id === "x" && typeof X_SVG !== "undefined") {\n'
              '          icon = X_SVG;\n'
              '        } else if (PROVIDER_ICON[p.id]) {\n'
              '          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;\n'
              '        } else if (p.id === "google") {\n'
              '          icon = GOOGLE_SVG;\n'
              '        }'
          )
          if old not in t:
              raise SystemExit("build block missing")
          t = t.replace(old, new, 1)
          p.write_text(t, encoding="utf-8")
          print("patched", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/web-shim.js
          git commit -m "fix: restore web-shim + official X logo SVG"
          git push

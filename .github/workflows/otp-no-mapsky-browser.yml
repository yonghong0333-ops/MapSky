name: otp-no-mapsky-browser
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/otp-no-mapsky-browser.yml'
      - 'scripts/patch-otp-no-mapsky-browser.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-otp-no-mapsky-browser.py
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: skip mapsky:// after OTP in browser (stop false offline)"
            git push
          fi

name: More toggle position
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_more_toggle_position.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css
          git commit -m "ui: place more/collapse toggle above or-divider" || echo "no changes"
          git push origin HEAD:main

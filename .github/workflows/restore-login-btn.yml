name: Restore login button UI
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore files from good commit and apply patch
        run: |
          git checkout 974031f81d0240633ddad008be9b766b0c4169ed -- public/style.css public/web-shim.js public/index.html

          python3 << 'PY'
from pathlib import Path

html = Path("public/index.html").read_text(encoding="utf-8")
old_form = '''      <form id="loginGateMagicForm" class="login-gate-magic-form">
        <input
          type="email"
          id="loginGateMagicEmail"
          class="login-gate-magic-input"
          placeholder="輸入 Email 取得登入連結"
          autocomplete="email"
          inputmode="email"
          required
        />
        <button type="submit" id="loginGateMagicSubmit" class="login-gate-btn login-gate-magic-submit">
          <span id="loginGateMagicSubmitLabel">寄送登入連結</span>
        </button>
      </form>'''
new_form = '''      <form id="loginGateMagicForm" class="login-gate-magic-form">
        <div class="login-gate-magic-row">
          <input
            type="email"
            id="loginGateMagicEmail"
            class="login-gate-magic-input"
            placeholder="輸入 Email 取得登入連結"
            autocomplete="email"
            inputmode="email"
            required
          />
          <button type="submit" id="loginGateMagicSubmit" class="login-gate-magic-submit" aria-label="寄送登入連結" title="寄送登入連結">
            <span id="loginGateMagicSubmitLabel" class="login-gate-magic-submit-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </span>
          </button>
        </div>
      </form>'''
assert old_form in html, "form not found"
Path("public/index.html").write_text(html.replace(old_form, new_form), encoding="utf-8")

css = Path("public/style.css").read_text(encoding="utf-8")
old_css = '''.login-gate-magic-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.login-gate-magic-input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 999px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-main);
  font-size: 14px;
  box-sizing: border-box;
}
.login-gate-magic-input:focus {
  outline: none;
  border-color: var(--accent);
}
.login-gate-magic-submit {
  width: 100%;
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}
.login-gate-magic-submit::after { border-color: rgba(255, 255, 255, 0.85); }
.login-gate-magic-submit:hover { background: var(--accent-hover); }
.login-gate-magic-submit[disabled] {
  opacity: 0.7;
  cursor: default;
  transform: none;
}'''
new_css = '''.login-gate-magic-form {
  display: block;
}
.login-gate-magic-row {
  position: relative;
  display: flex;
  align-items: center;
}
.login-gate-magic-input {
  width: 100%;
  padding: 12px 48px 12px 16px;
  border-radius: 999px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-main);
  font-size: 14px;
  box-sizing: border-box;
}
.login-gate-magic-input:focus {
  outline: none;
  border-color: var(--accent);
}
.login-gate-magic-submit {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  padding: 0;
  margin: 0;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(20, 45, 95, 0.18);
  transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
  flex-shrink: 0;
}
.login-gate-magic-submit:hover {
  background: var(--accent-hover);
  transform: translateY(-50%) scale(1.05);
}
.login-gate-magic-submit:active {
  transform: translateY(-50%) scale(0.96);
}
.login-gate-magic-submit[disabled] {
  opacity: 0.65;
  cursor: default;
  pointer-events: none;
  transform: translateY(-50%);
}
.login-gate-magic-submit-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 0;
  font-size: 13px;
  font-weight: 700;
}
.login-gate-magic-submit-icon svg {
  display: block;
}'''
assert old_css in css, "css not found"
Path("public/style.css").write_text(css.replace(old_css, new_css), encoding="utf-8")

js = Path("public/web-shim.js").read_text(encoding="utf-8")
ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
old_cooldown = '''  function startMagicLinkCooldown(submitBtn, labelEl) {
    let remaining = MAGIC_LINK_COOLDOWN_SECONDS;
    submitBtn.disabled = true;
    const tick = () => {
      labelEl.textContent = `${remaining} 秒後可再寄送`;
      if (remaining <= 0) {
        clearInterval(magicLinkCooldownTimer);
        magicLinkCooldownTimer = null;
        submitBtn.disabled = false;
        labelEl.textContent = "寄送登入連結";
        return;
      }
      remaining -= 1;
    };
    tick();
    magicLinkCooldownTimer = setInterval(tick, 1000);
  }'''
new_cooldown = f'''  function startMagicLinkCooldown(submitBtn, labelEl) {{\n    let remaining = MAGIC_LINK_COOLDOWN_SECONDS;\n    submitBtn.disabled = true;\n    const tick = () => {{\n      labelEl.innerHTML = remaining > 0 ? String(remaining) : `{ARROW}`;\n      submitBtn.setAttribute("aria-label", remaining > 0 ? `${{remaining}} 秒後可再寄送` : "寄送登入連結");\n      submitBtn.setAttribute("title", remaining > 0 ? `${{remaining}} 秒後可再寄送` : "寄送登入連結");\n      if (remaining <= 0) {{\n        clearInterval(magicLinkCooldownTimer);\n        magicLinkCooldownTimer = null;\n        submitBtn.disabled = false;\n        return;\n      }}\n      remaining -= 1;\n    }};\n    tick();\n    magicLinkCooldownTimer = setInterval(tick, 1000);\n  }}'''
assert old_cooldown in js, "cooldown not found"
js = js.replace(old_cooldown, new_cooldown)
js = js.replace('labelEl.textContent = "寄送登入連結";', f'labelEl.innerHTML = `{ARROW}`;\n        submitBtn.setAttribute("aria-label", "寄送登入連結");\n        submitBtn.setAttribute("title", "寄送登入連結");')
js = js.replace('labelEl.textContent = "寄送中…";', f'labelEl.innerHTML = "…";\n      submitBtn.setAttribute("aria-label", "寄送中…");\n      submitBtn.setAttribute("title", "寄送中…");')
Path("public/web-shim.js").write_text(js, encoding="utf-8")
print("patch applied ok")
PY
      - name: Commit and push
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css public/web-shim.js
          git commit -m "style(login): 將寄送登入連結改為輸入框右側圓形向上箭頭按鈕" || echo "no changes"
          git push origin main

name: Restore login button UI
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore originals and apply patch
        run: |
          git checkout 974031f81d0240633ddad008be9b766b0c4169ed -- public/style.css public/web-shim.js public/index.html
          python3 scripts/apply_login_btn_patch.py
      - name: Commit and push
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css public/web-shim.js
          git status
          git commit -m "style(login): circular up-arrow submit on email input" || echo "no changes"
          git push origin HEAD:main

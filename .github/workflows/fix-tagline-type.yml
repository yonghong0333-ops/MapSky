name: Fix tagline type
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_fix_tagline_type.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js
          git commit -m "fix(auth): show terminal tagline after title typing" || echo "no changes"
          git push origin HEAD:main

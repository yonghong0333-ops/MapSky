name: Hide email OTP
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/assemble_hide_otp.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/_lib/mailer.js api/auth/login.js api/auth/callback.js public/web-shim.js public/index.html public/style.css
          git commit -m "feat(auth): hide OTP in email; reveal input only on cross-device" || echo "no changes"
          git push origin HEAD:main

# 編譯＋發佈桌面版（electron/ 資料夾），Windows 跟 macOS 都會建。
#
# 這支只能用 workflow_dispatch 觸發，不會因為 push 到這個 repo 就自動跑——
# 「軟體內部」（public/ 網站本體）跟「外殼」（electron/ 桌面殼）雖然放在
# 同一個 repo，但發版時機是分開的兩件事，不希望改網站程式碼時意外觸發一次
# 桌面版重新編譯。
#
# 實際觸發來源是後台管理頁的「發佈新版桌面版」按鈕：使用者選頻道（正式版／
# 公開測試版／一般測試版）→ api/weather/status.js 的 publish-desktop action
# → 用伺服器端環境變數 GITHUB_ACTIONS_TOKEN 呼叫 GitHub 的 workflow_dispatch
# API → 這支 workflow 才會開始跑。也可以直接在 GitHub 網頁的 Actions 分頁
# 手動觸發，不一定要透過後台管理。
#
# 版本號規則是 YY.N（YY = 年份末兩碼，N = 這個年度累計第幾版，三個頻道共用
# 同一組流水號，Windows／macOS 也共用同一個版號、同一個 GitHub Release），
# 實際計算在 scripts/compute-next-version.js，測試版頻道會多帶 -beta.N /
# -alpha.N 的 prerelease 標籤，electron-builder 看到就會自動發到對應的更新
# 頻道（latest.yml / beta.yml / alpha.yml，Windows／macOS 各自一份）。
#
# 四個 job 的分工：
#   version      —— 只算版本號，不用建置環境，跑最快，其他 job 都要等它。
#   build-win    —— 編出 .exe，發佈到 GitHub Release，成功後 build-mac 才開始
#                    （刻意排順序、不平行跑，避免兩個 job 同時搶著建立同一個
#                    Release 造成衝突）。
#   build-mac    —— 編出 .dmg/.zip，上傳到 build-win 剛剛建好的同一個 Release。
#                    未申請 Apple Developer Program（沒有簽章憑證），所以用
#                    ad-hoc 自簽（electron/scripts/adhoc-sign.js，在 afterPack
#                    對最終的 universal .app 跑 codesign --sign -）。自簽只是讓
#                    整包 .app 有一份有效簽章，避免 Apple Silicon 顯示「已損毀」；
#                    Gatekeeper 還是會擋，使用者第一次打開要到「系統設定 →
#                    隱私權與安全性 → 仍要打開」放行，或執行 `xattr -cr`。
#                    ad-hoc 簽章每次建置的身分都不一樣，所以 macOS 上的自動更新
#                    （electron-updater／Squirrel.Mac）仍可能無法正常完成安裝；
#                    要根治需要加入 Apple Developer Program（年費 US$99）做
#                    Developer ID 簽章＋公證。
#   commit-version —— 等兩個平台都建完才把版號更新後的 package.json 一次
#                    commit 回去，不要讓兩個平台各自 commit 互相衝突。
name: Build & Publish Desktop

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "發佈頻道"
        required: true
        default: stable
        type: choice
        options:
          - stable # 正式版：所有使用者都看得到
          - public-beta # 公開測試版：後台指派過資格的使用者 + 超級管理員
          - internal-beta # 一般測試版：只有超級管理員看得到

permissions:
  contents: write # 要能建立 Release、也要能把版號的 commit push 回去

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 計算下一個版本號（YY.N 規則）
        id: version
        run: |
          V=$(node electron/scripts/compute-next-version.js ${{ github.event.inputs.channel }})
          echo "下一個版本號：$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: 套用版本號到 package.json（只在建置時套用，不 commit）
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build 並發佈到 GitHub Releases
        run: npm run publish:win
        env:
          # electron-builder 認的是 GH_TOKEN 這個環境變數名稱；用 Actions 內建
          # 的 GITHUB_TOKEN 就夠了（同一個 repo 建 Release），不用另外存一組
          # Personal Access Token 在這裡。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    needs: [version, build-win] # 等 Windows 先把 Release 建好，mac 只是往同一個 Release 加檔案
    runs-on: macos-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: 套用版本號到 package.json（只在建置時套用，不 commit）
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build 並發佈到 GitHub Releases（ad-hoc 自簽）
        run: npm run publish:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 沒有 Apple Developer Program 憑證，明確告訴 electron-builder 不要
          # 嘗試去找簽章身分（不設的話，遇到本機剛好有殘留憑證會誤觸發簽章，
          # 反而建置失敗）。package.json 裡 build.mac.identity 已經設 null，
          # 這裡是雙重保險。ad-hoc 自簽不走 electron-builder 的簽章流程，
          # 是由 build.afterPack 指到的 scripts/adhoc-sign.js 自己呼叫 codesign。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 實驗：把主程式的 SDK 版本標記改成 macOS 27，讓新系統套用最新的視窗控制
          # 按鈕（紅綠燈）樣式。只在測試版頻道啟用，正式版（stable）不套用。
          MAPSKY_MAC_SDK: ${{ github.event.inputs.channel == 'stable' && 'off' || '27.0' }}

  commit-version:
    needs: [version, build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 套用版本號到 package.json
        working-directory: electron
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: 把版號更新後的 package.json 一起 commit 回去
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add electron/package.json
          git diff --cached --quiet || git commit -m "chore(desktop): release ${{ needs.version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

name: run-boot-open-patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-boot-open-patch.yml'
      - 'scripts/patch-boot-open.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch-boot-open.py
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js public/style.css
          if git diff --staged --quiet; then
            echo No changes
          else
            git commit -m "ui: open animation when boot loading finishes"
            git push
          fi

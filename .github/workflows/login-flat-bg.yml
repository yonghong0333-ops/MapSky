name: Login flat bg terminal
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_login_flat.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css public/web-shim.js
          git add -f public/login-bg.jpg 2>/dev/null || true
          git commit -m "ui(auth): weather bg, no card, terminal MapSky typewriter" || echo "no changes"
          git push origin HEAD:main

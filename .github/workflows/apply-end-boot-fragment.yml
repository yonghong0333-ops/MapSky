name: apply-end-boot-fragment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-end-boot-fragment.yml'
      - 'scripts/endLoginGateBoot.fragment.js'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          js_path = Path('public/web-shim.js')
          frag = Path('scripts/endLoginGateBoot.fragment.js').read_text(encoding='utf-8').strip() + '\n'
          js = js_path.read_text(encoding='utf-8')
          pat = re.compile(
              r'function endLoginGateBoot\([^)]*\) \{[\s\S]*?setTimeout\(finish, \d+\);\s*\}',
              re.M,
          )
          m = pat.search(js)
          if not m:
              raise SystemExit('fn not found')
          js = js[:m.start()] + frag + js[m.end():]
          # not logged in immediate
          js = js.replace(
              'endLoginGateBoot();\n    if (statusEl) {\n      statusEl.textContent = "";',
              'endLoginGateBoot({ immediate: true });\n    if (statusEl) {\n      statusEl.textContent = "";',
              1,
          )
          js_path.write_text(js, encoding='utf-8')
          print('js ok', 'immediate: true' in js)

          css_path = Path('public/style.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* BOOT_HIDE_WHEN_NOT_BOOTING */'
          if marker not in css:
              css_path.write_text(css.rstrip() + '''

/* BOOT_HIDE_WHEN_NOT_BOOTING */
.login-gate:not(.login-gate--booting) > .login-gate-boot {
  display: none !important;
}
.login-gate-boot.hidden {
  display: none !important;
}
''', encoding='utf-8')
              print('css ok')
          PY
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js public/style.css
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: hide boot spinner when login form is shown"
            git push
          fi

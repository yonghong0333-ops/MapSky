name: Boot spinner beside weather
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_boot_spinner_beside.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html public/style.css
          git commit -m "ui: spinner beside weather cycle on login boot" || echo "no changes"
          git push origin HEAD:main

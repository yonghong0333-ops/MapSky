name: Same-device app jump
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_same_device_app_jump.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/auth/callback.js
          git commit -m "feat(auth): same-device magic link 302/auto-open mapsky:// App" || echo "no changes"
          git push origin HEAD:main

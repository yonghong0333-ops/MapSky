name: Apply device bind rest
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 scripts/otp/patch_device.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/auth/callback.js public/web-shim.js
          git commit -m "feat(auth): cross-device magic-link requires OTP" || echo "no changes"
          git push origin HEAD:main

name: Boot until all data
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_boot_all_data.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/renderer.js public/web-shim.js
          git commit -m "ui: end boot spinner only after all weather side data loaded" || echo "no changes"
          git push origin HEAD:main

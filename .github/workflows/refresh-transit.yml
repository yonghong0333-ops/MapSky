name: refresh-transit

on:
  workflow_dispatch:
  schedule:
    # 台北 05:10，一天只打一次 TDX，抓當日時刻表
    - cron: "10 21 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh THSR + KRTC + TRA daily timetables
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: node scripts/refresh-transit-cache.js
      - name: Commit caches
        run: |
          git config user.name "mapsky-bot"
          git config user.email "mapsky-bot@users.noreply.github.com"
          git add api/_data/thsr-timetable.json api/_data/krtc-timetable.json api/_data/tra-timetable.json api/_data/tra-stations.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(transit): refresh daily timetable cache $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

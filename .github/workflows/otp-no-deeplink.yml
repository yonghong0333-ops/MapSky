name: otp-no-deeplink
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/otp-no-deeplink.yml'
      - 'scripts/patch-otp-no-deeplink.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-otp-no-deeplink.py
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: no mapsky:// after in-app OTP (stop App offline screen)"
            git push
          fi

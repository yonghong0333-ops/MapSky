name: Boot until weather data
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_boot_until_data.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js public/renderer.js public/style.css
          git commit -m "ui: keep boot animation until weather data is ready" || echo "no changes"
          git push origin HEAD:main

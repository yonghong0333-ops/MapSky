name: fix-gyro-trigger
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-gyro-trigger.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace gyro init
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('public/renderer.js')
          js = p.read_text(encoding='utf-8')
          start = js.find('(function initGyroGlassShine()')
          if start < 0:
              raise SystemExit('no gyro fn')
          # end at next IIFE after this one
          end = js.find('(function initToolsGlassPress', start)
          if end < 0:
              end = js.find('(function initToolsSectionCollapse', start)
          if end < 0:
              raise SystemExit('no end marker')

          new_fn = r'''(function initGyroGlassShine() {
  let card = null;
  let enabled = false;
  let raf = 0;
  let targetX = 50;
  let targetY = 18;
  let targetTiltX = 0;
  let targetTiltY = 0;
  let curX = 50;
  let curY = 18;
  let curTiltX = 0;
  let curTiltY = 0;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function ensureCard() {
    if (card && document.contains(card)) return card;
    card = document.querySelector(".current-card");
    return card;
  }

  function tick() {
    const el = ensureCard();
    if (!el) {
      raf = requestAnimationFrame(tick);
      return;
    }
    curX += (targetX - curX) * 0.18;
    curY += (targetY - curY) * 0.18;
    curTiltX += (targetTiltX - curTiltX) * 0.18;
    curTiltY += (targetTiltY - curTiltY) * 0.18;
    el.style.setProperty("--shine-x", curX.toFixed(2) + "%");
    el.style.setProperty("--shine-y", curY.toFixed(2) + "%");
    el.style.setProperty("--tilt-x", curTiltX.toFixed(3) + "deg");
    el.style.setProperty("--tilt-y", curTiltY.toFixed(3) + "deg");
    el.style.setProperty("--shine-angle", (-12 - (curX - 50) * 0.2).toFixed(2) + "deg");
    raf = requestAnimationFrame(tick);
  }

  function onOrient(e) {
    const gamma = typeof e.gamma === "number" ? e.gamma : 0;
    const beta = typeof e.beta === "number" ? e.beta : 0;
    // 提高靈敏度，較容易看出移動
    targetX = clamp(50 + gamma * 1.4, 5, 95);
    targetY = clamp(20 + (beta - 40) * 0.4, 4, 60);
    targetTiltY = clamp(gamma * 0.14, -7, 7);
    targetTiltX = clamp(-(beta - 40) * 0.07, -5, 5);
  }

  function onMotion(e) {
    // 部分 WebView 只給 devicemotion
    try {
      const a = e.accelerationIncludingGravity || e.acceleration;
      if (!a) return;
      const x = typeof a.x === "number" ? a.x : 0;
      const y = typeof a.y === "number" ? a.y : 0;
      targetX = clamp(50 + x * 6, 5, 95);
      targetY = clamp(22 - y * 3, 4, 60);
      targetTiltY = clamp(x * 0.6, -7, 7);
      targetTiltX = clamp(y * 0.35, -5, 5);
    } catch (err) {}
  }

  function startListeners() {
    if (enabled) return;
    enabled = true;
    window.addEventListener("deviceorientation", onOrient, { passive: true });
    window.addEventListener("deviceorientationabsolute", onOrient, { passive: true });
    window.addEventListener("devicemotion", onMotion, { passive: true });
    if (!raf) raf = requestAnimationFrame(tick);
  }

  async function requestAndStart() {
    try {
      if (typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function") {
        const state = await DeviceOrientationEvent.requestPermission();
        if (state === "granted") {
          startListeners();
          return;
        }
      }
    } catch (err) {}
    // 即使 permission API 失敗，仍嘗試直接聽（原生殼／已授權情況）
    startListeners();
    try {
      if (typeof DeviceMotionEvent !== "undefined" &&
          typeof DeviceMotionEvent.requestPermission === "function") {
        await DeviceMotionEvent.requestPermission();
      }
    } catch (err) {}
  }

  function bindGesture() {
    const handler = () => {
      requestAndStart();
    };
    // 任意第一次觸碰都觸發（不只卡片）
    document.addEventListener("pointerdown", handler, { once: true, passive: true });
    document.addEventListener("touchstart", handler, { once: true, passive: true });
    document.addEventListener("click", handler, { once: true, passive: true });
  }

  // 觸控備援：手指在卡片上移動也會帶動反光（方便確認 CSS 有生效）
  function bindPointerFallback() {
    const el = ensureCard();
    if (!el || el.dataset.gyroPointerBound) return;
    el.dataset.gyroPointerBound = "1";
    el.addEventListener("pointermove", (e) => {
      if (e.pointerType === "mouse" && e.buttons === 0) return;
      const rect = el.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      targetX = clamp(x, 5, 95);
      targetY = clamp(y, 4, 60);
      targetTiltY = clamp((x - 50) * 0.12, -7, 7);
      targetTiltX = clamp((y - 40) * -0.08, -5, 5);
      if (!raf) raf = requestAnimationFrame(tick);
    }, { passive: true });
  }

  function boot() {
    ensureCard();
    bindGesture();
    bindPointerFallback();
    // 非 iOS 或已授權：直接試
    try {
      if (!(typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function")) {
        startListeners();
      }
    } catch (e) {}
    // 延遲再綁一次（等 DOM 就緒）
    setTimeout(() => {
      ensureCard();
      bindPointerFallback();
      if (!raf) raf = requestAnimationFrame(tick);
    }, 800);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

'''

          js = js[:start] + new_fn + js[end:]
          p.write_text(js, encoding='utf-8')
          print('replaced', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/renderer.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: gyro shine trigger for native WebView + touch fallback"
            git push
          fi

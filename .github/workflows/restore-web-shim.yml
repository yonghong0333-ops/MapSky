name: restore-web-shim
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-web-shim.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and prefer x.png
        run: |
          set -e
          git show 7d88fa9055e0fa3e462a2a71a2e8ac116b3b0190:public/web-shim.js > public/web-shim.js
          python3 << 'PY'
          from pathlib import Path
          p = Path('public/web-shim.js')
          t = p.read_text(encoding='utf-8')
          if len(t) < 50000:
              raise SystemExit('restore failed, size too small')
          old = '''        // 一律用 <img> 官方圖檔，原生 Liquid Glass 才能用 URL 下載（inline SVG 無法當 UIImage）
        if (p.id === "x" && typeof X_SVG !== "undefined") {
          icon = X_SVG;
        } else if (PROVIDER_ICON[p.id]) {
          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;
        } else if (p.id === "google") {
          icon = GOOGLE_SVG;
        }'''
          new = '''        // 一律用 <img> 官方圖檔，原生 Liquid Glass 才能用 URL 下載（inline SVG 無法當 UIImage）
        // X 直接用 public/login-icons/x.png
        if (PROVIDER_ICON[p.id]) {
          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;
        } else if (p.id === "google") {
          icon = GOOGLE_SVG;
        } else if (p.id === "x" && typeof X_SVG !== "undefined") {
          icon = X_SVG;
        }'''
          if old not in t:
              raise SystemExit('build block missing')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          print('patched', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js
          git commit -m "ui(auth): use public/login-icons/x.png for X login button" || echo no
          git push

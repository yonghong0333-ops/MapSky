name: Fix direct login
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: python3 scripts/otp/fix_direct_login.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/auth/callback.js
          git commit -m "fix(auth): magic-link click always logs in (email client has no device cookie)" || echo "no changes"
          git push origin HEAD:main

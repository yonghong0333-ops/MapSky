name: use-x-png
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/use-x-png.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore good web-shim and prefer x.png
        run: |
          set -e
          # restore from known good commit before the bad push
          git show 7d88fa9055e0fa3e462a2a71a2e8ac116b3b0190:public/web-shim.js > public/web-shim.js
          wc -c public/web-shim.js
          python3 << 'PY'
          from pathlib import Path
          p = Path("public/web-shim.js")
          t = p.read_text(encoding="utf-8")
          old = '''        // 一律用 <img> 官方圖檔，原生 Liquid Glass 才能用 URL 下載（inline SVG 無法當 UIImage）
        if (p.id === "x" && typeof X_SVG !== "undefined") {
          icon = X_SVG;
        } else if (PROVIDER_ICON[p.id]) {
          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;
        } else if (p.id === "google") {
          icon = GOOGLE_SVG;
        }'''
          new = '''        // 一律用 <img> 官方圖檔，原生 Liquid Glass 才能用 URL 下載（inline SVG 無法當 UIImage）
        // X 直接用 public/login-icons/x.png
        if (PROVIDER_ICON[p.id]) {
          icon = `<img src="${PROVIDER_ICON[p.id]}" alt="" width="18" height="18" />`;
        } else if (p.id === "google") {
          icon = GOOGLE_SVG;
        } else if (p.id === "x" && typeof X_SVG !== "undefined") {
          icon = X_SVG;
        }'''
          if old not in t:
              raise SystemExit("build block missing")
          t = t.replace(old, new, 1)
          p.write_text(t, encoding="utf-8")
          print("patched", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/web-shim.js
          git commit -m "ui(auth): use public/login-icons/x.png for X login button" || echo "no changes"
          git push

name: Device judge on link click
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_device_judge_click.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add api/auth/callback.js public/web-shim.js
          git commit -m "feat(auth): link click — same device via App xchg, else OTP" || echo "no changes"
          git push origin HEAD:main

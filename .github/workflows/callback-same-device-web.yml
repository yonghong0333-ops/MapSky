name: callback-same-device-web
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/callback-same-device-web.yml'
      - 'scripts/patch-callback-same-device-web.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-callback-same-device-web.py
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add api/auth/callback.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: same-device magic-link never uses mapsky:// (App offline)"
            git push
          fi

name: otp-soft-login
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/otp-soft-login.yml'
      - 'scripts/patch-otp-soft-login.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-otp-soft-login.py
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "fix: soft-login after OTP verify (avoid false offline screen)"
            git push
          fi

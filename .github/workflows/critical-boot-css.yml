name: critical-boot-css
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/critical-boot-css.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject critical CSS
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('public/index.html')
          h = p.read_text(encoding='utf-8')
          if 'CRITICAL_BOOT_CSS' in h:
              print('already')
          else:
              crit = '''<!-- CRITICAL_BOOT_CSS -->
          <style id="critical-boot-css">
            html, body {
              margin: 0;
              min-height: 100%;
              background: linear-gradient(180deg, #5b9cf5 0%, #7eb6f7 42%, #c5e0fc 100%) !important;
              background-color: #7eb6f7 !important;
            }
            .login-gate.login-gate--booting {
              position: fixed !important;
              inset: 0 !important;
              z-index: 99999 !important;
              display: flex !important;
              align-items: center !important;
              justify-content: center !important;
              background: linear-gradient(180deg, #5b9cf5 0%, #7eb6f7 42%, #c5e0fc 100%) !important;
              margin: 0 !important;
            }
            .login-gate-boot {
              display: flex !important;
              flex-direction: column !important;
              align-items: center !important;
              justify-content: center !important;
              gap: 22px !important;
              color: rgba(30, 58, 95, 0.85) !important;
              font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif !important;
              font-size: 15px !important;
              font-weight: 600 !important;
            }
            .login-gate-boot-orbit-wrap {
              position: relative !important;
              width: 88px !important;
              height: 88px !important;
              display: flex !important;
              align-items: center !important;
              justify-content: center !important;
            }
            .login-gate-boot-orbit-ring {
              position: absolute !important;
              inset: 0 !important;
              border-radius: 50% !important;
              border: 3px solid rgba(255, 255, 255, 0.4) !important;
              border-top-color: #3b82f6 !important;
              animation: criticalBootSpin 0.85s linear infinite !important;
            }
            @keyframes criticalBootSpin {
              to { transform: rotate(360deg); }
            }
          </style>
          '''
              needle = '<link rel="stylesheet" href="style.css" />'
              if needle not in h:
                  raise SystemExit('needle missing')
              h = h.replace(needle, crit + needle, 1)
              p.write_text(h, encoding='utf-8')
              print('patched', len(h))
          PY
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ui: critical boot CSS — no white flash on login redirect"
            git push
          fi

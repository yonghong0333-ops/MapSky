name: URGENT-restore-session
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Force restore session.js when truncated
        run: |
          set -e
          sz=$(wc -c < api/auth/session.js || echo 0)
          echo "session.js size=$sz"
          if [ "$sz" -lt 20000 ]; then
            echo "TRUNCATED - restoring full file from 7b039df"
            git show 7b039df27d1aa096c33d98d5b07878d1f8e6f4e9:api/auth/session.js > api/auth/session.js
            python3 << 'PY'
from pathlib import Path
p = Path("api/auth/session.js")
s = p.read_text()
# inject devices-sync import
if "handleDevicesSync" not in s:
    s = s.replace(
        'const { tryHandleStore } = require("../_lib/session-store-actions");\n\nconst { parseCookies',
        'const { tryHandleStore } = require("../_lib/session-store-actions");\nconst { handleDevicesSync } = require("../_lib/devices-sync");\n\nconst { parseCookies',
        1,
    )
# inject early devices routing (by __devices or action)
old = "module.exports = async function handler(req, res) {\n  if (await tryHandleStore(req, res)) return;"
new = '''function isDevicesRequest(req) {
  if (req.query && req.query.__devices === "1") return true;
  const a = req.query && req.query.action;
  return a === "list" || a === "heartbeat" || a === "remove";
}

module.exports = async function handler(req, res) {
  if (isDevicesRequest(req)) {
    return handleDevicesSync(req, res);
  }

  if (await tryHandleStore(req, res)) return;'''
if old in s:
    s = s.replace(old, new, 1)
    print("patched devices route")
else:
    print("handler pattern not found, size", len(s))
p.write_text(s)
print("final size", p.stat().st_size)
PY
            # vercel rewrite
            python3 << 'PY'
import json
from pathlib import Path
v = json.loads(Path("vercel.json").read_text())
rewrites = v.get("rewrites", [])
if not any(r.get("source") == "/api/devices/sync" for r in rewrites):
    rewrites.insert(0, {"source": "/api/devices/sync", "destination": "/api/auth/session?__devices=1"})
    v["rewrites"] = rewrites
    Path("vercel.json").write_text(json.dumps(v, indent=2, ensure_ascii=False) + "\n")
    print("added rewrite")
else:
    print("rewrite ok")
PY
            rm -f api/devices/sync.js
            rmdir api/devices 2>/dev/null || true
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add -A api/auth/session.js vercel.json
            git add -u api/devices 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "no changes"
            else
              git commit -m "auto-restore: full session.js + devices (Hobby 12-fn)"
              git push origin HEAD:main
            fi
          else
            echo "session.js healthy ($sz bytes), skip"
          fi

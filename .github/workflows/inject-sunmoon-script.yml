name: inject-sunmoon-script
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inject-sunmoon-script.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sed inject
        run: |
          set -e
          if grep -q 'sun-moon-detail.js' public/index.html; then
            echo already
          else
            if grep -q 'chart-polish.js' public/index.html; then
              sed -i 's|<script src="chart-polish.js"></script>|<script src="chart-polish.js"></script>\n<script src="sun-moon-detail.js"></script>|' public/index.html
            else
              sed -i 's|<script src="web-shim.js"></script>|<script src="web-shim.js"></script>\n<script src="sun-moon-detail.js"></script>|' public/index.html
            fi
            grep -n 'sun-moon-detail.js' public/index.html
          fi
      - name: Commit
        run: |
          git config user.name mapsky-bot
          git config user.email bot@mapsky.local
          git add public/index.html
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ui: load sun-moon-detail.js"
            git push
          fi

name: restore-web-shim
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-webshim.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore web-shim.js from last good commit
        run: |
          curl -sL "https://raw.githubusercontent.com/yonghong0333-ops/MapSky/ee1300e5/public/web-shim.js" -o public/web-shim.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/web-shim.js")
          s = p.read_text(encoding="utf-8")
          old = "    const showOtp = true;"
          new = "    const showOtp = forceOtp || !mobile;"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
              print("fixed showOtp")
          elif new in s:
              print("already fixed")
          else:
              raise SystemExit("showOtp line missing")
          print("size", p.stat().st_size)
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/web-shim.js
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "fix: restore web-shim.js and apply showOtp = forceOtp || !mobile"
            git push
          fi

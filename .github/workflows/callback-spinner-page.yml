name: callback-spinner-page
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/callback-spinner-page.yml'
      - 'scripts/patch-callback-spinner-page.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-callback-spinner-page.py
      - name: Commit
        run: |
          git config user.name "mapsky-bot"
          git config user.email "bot@mapsky.local"
          git add api/auth/callback.js
          if git diff --staged --quiet; then echo No changes; else
            git commit -m "ui: same-device magic-link intermediate page = spinner"
            git push
          fi

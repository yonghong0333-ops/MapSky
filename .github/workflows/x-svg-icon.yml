name: X SVG icon
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/apply_x_svg_icon.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/web-shim.js public/login-icons/x.svg
          git commit -m "ui(auth): use official X SVG for login icon" || echo "no changes"
          git push origin HEAD:main

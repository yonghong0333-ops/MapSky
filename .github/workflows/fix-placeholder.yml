name: Fix placeholder
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/otp/fix_placeholder.py
      - name: Commit
        run: |
          git config user.name "MapSky Bot"
          git config user.email "bot@mapsky.local"
          git add public/index.html
          git commit -m "ui: change email placeholder to 請輸入電子郵件" || echo "no changes"
          git push origin HEAD:main

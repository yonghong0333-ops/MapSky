<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" id="themeColorMeta" />
  <title>MapSky AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --ai-bg: #0f172a; --ai-fg: rgba(255, 255, 255, 0.92); --ai-muted: rgba(255, 255, 255, 0.42);
      --ai-border: rgba(255, 255, 255, 0.1); --ai-panel: rgba(15, 23, 42, 0.96); --ai-chip: rgba(255, 255, 255, 0.08);
      --ai-user: #2563eb; --ai-model-bg: rgba(255, 255, 255, 0.08); --ai-model-border: rgba(255, 255, 255, 0.12);
      --ai-input-bg: rgba(255, 255, 255, 0.06); --ai-input-border: rgba(255, 255, 255, 0.14);
      --ai-drawer: #111827; --ai-error-bg: rgba(220, 38, 38, 0.18); --ai-error-border: rgba(220, 38, 38, 0.4);
      --ai-error-fg: #fecaca; --ai-theme-color: #0f172a;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --ai-bg: #eef2f7; --ai-fg: #0f172a; --ai-muted: rgba(15, 23, 42, 0.5);
        --ai-border: rgba(15, 23, 42, 0.1); --ai-panel: rgba(255, 255, 255, 0.96); --ai-chip: rgba(15, 23, 42, 0.06);
        --ai-user: #2563eb; --ai-model-bg: #ffffff; --ai-model-border: rgba(15, 23, 42, 0.1);
        --ai-input-bg: #ffffff; --ai-input-border: rgba(15, 23, 42, 0.12);
        --ai-drawer: #ffffff; --ai-error-bg: rgba(220, 38, 38, 0.1); --ai-error-border: rgba(220, 38, 38, 0.35);
        --ai-error-fg: #b91c1c; --ai-theme-color: #eef2f7;
      }
    }
    html[data-theme="light"] {
      --ai-bg: #eef2f7; --ai-fg: #0f172a; --ai-muted: rgba(15, 23, 42, 0.5);
      --ai-border: rgba(15, 23, 42, 0.1); --ai-panel: rgba(255, 255, 255, 0.96); --ai-chip: rgba(15, 23, 42, 0.06);
      --ai-user: #2563eb; --ai-model-bg: #ffffff; --ai-model-border: rgba(15, 23, 42, 0.1);
      --ai-input-bg: #ffffff; --ai-input-border: rgba(15, 23, 42, 0.12);
      --ai-drawer: #ffffff; --ai-error-bg: rgba(220, 38, 38, 0.1); --ai-error-border: rgba(220, 38, 38, 0.35);
      --ai-error-fg: #b91c1c; --ai-theme-color: #eef2f7;
    }
    html[data-theme="dark"] {
      --ai-bg: #0f172a; --ai-fg: rgba(255, 255, 255, 0.92); --ai-muted: rgba(255, 255, 255, 0.42);
      --ai-border: rgba(255, 255, 255, 0.1); --ai-panel: rgba(15, 23, 42, 0.96); --ai-chip: rgba(255, 255, 255, 0.08);
      --ai-user: #2563eb; --ai-model-bg: rgba(255, 255, 255, 0.08); --ai-model-border: rgba(255, 255, 255, 0.12);
      --ai-input-bg: rgba(255, 255, 255, 0.06); --ai-input-border: rgba(255, 255, 255, 0.14);
      --ai-drawer: #111827; --ai-error-bg: rgba(220, 38, 38, 0.18); --ai-error-border: rgba(220, 38, 38, 0.4);
      --ai-error-fg: #fecaca; --ai-theme-color: #0f172a;
    }
    html, body {
      height: 100%; width: 100%; min-height: 100%; min-height: 100dvh;
      background: var(--ai-bg); color: var(--ai-fg);
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing: antialiased; overflow: hidden;
    }
    body {
      display: flex; flex-direction: column; min-height: 100%; min-height: 100dvh;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) 0 env(safe-area-inset-left, 0);
    }
    header { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--ai-border); background: var(--ai-panel); }
    header .titles { flex: 1; text-align: center; min-width: 0; }
    header .label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ai-muted); }
    header .title { font-size: 17px; font-weight: 700; color: var(--ai-fg); }
    .hdr-btn { width: 40px; height: 40px; border: none; border-radius: 12px; background: var(--ai-chip); color: var(--ai-fg); font-size: 18px; cursor: pointer; flex-shrink: 0; }
    #messages {
      flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
      -webkit-overflow-scrolling: touch; padding: 20px 16px 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .welcome { margin: 18vh auto 0; text-align: center; padding: 24px 28px; max-width: 300px; width: 100%; box-sizing: border-box; }
    .welcome-icon { font-size: 36px; line-height: 1; margin-bottom: 14px; opacity: 0.9; }
    .welcome-title { font-size: 22px; font-weight: 700; color: var(--ai-fg); margin-bottom: 10px; letter-spacing: -0.02em; }
    .welcome-sub { font-size: 14px; line-height: 1.65; color: var(--ai-muted); word-break: keep-all; overflow-wrap: break-word; }
    .bubble {
      max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 15px;
      line-height: 1.55; white-space: pre-wrap; word-break: break-word;
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
      animation: bubbleIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .bubble.user {
      align-self: flex-end; background: var(--ai-user); color: #fff; border-bottom-right-radius: 6px;
      animation-name: bubbleInUser;
    }
    .bubble.model {
      align-self: stretch;
      max-width: 100%;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 2px 2px 8px;
      color: var(--ai-fg);
    }
    .bubble.error { align-self: center; background: var(--ai-error-bg); border: 1px solid var(--ai-error-border); color: var(--ai-error-fg); font-size: 13px; }
    .bubble.system { align-self: center; font-size: 13px; color: var(--ai-muted); background: transparent; padding: 4px 8px; }
    .bubble.thinking {
      align-self: flex-start;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      width: auto;
      max-width: none;
      min-width: 0;
      min-height: 0;
      padding: 4px 2px;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    .bubble.thinking i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.28;
      transform: translateY(0) scale(0.85);
      animation: dotSeq 1.2s infinite ease-in-out;
    }
    .bubble.thinking i:nth-child(1) { animation-delay: 0s; }
    .bubble.thinking i:nth-child(2) { animation-delay: 0.4s; }
    .bubble.thinking i:nth-child(3) { animation-delay: 0.8s; }
    .bubble.has-image,
    .bubble.has-image-only {
      width: min(72vw, 240px);
      max-width: min(72vw, 240px);
      padding: 4px;
      overflow: visible;
      flex-shrink: 0;
    }
    .bubble.user.has-image-only { background: transparent; }
    .bubble.has-image img.preview,
    .bubble.has-image-only img.preview,
    .bubble img.preview {
      display: block; width: 100%; height: auto; max-height: 280px;
      border-radius: 12px; margin: 0; object-fit: cover; order: 0;
      background: rgba(15, 23, 42, 0.06);
    }
    .bubble .bubble-text { order: 1; }
    .bubble.model .bubble-text.md { white-space: normal; }
    .bubble.model .md > :first-child { margin-top: 0; }
    .bubble.model .md > :last-child { margin-bottom: 0; }
    .bubble.model .md h1,
    .bubble.model .md h2,
    .bubble.model .md h3,
    .bubble.model .md h4 {
      font-weight: 750;
      line-height: 1.35;
      letter-spacing: -0.01em;
      margin: 0.85em 0 0.35em;
    }
    .bubble.model .md h1 { font-size: 1.22em; }
    .bubble.model .md h2 { font-size: 1.12em; }
    .bubble.model .md h3 { font-size: 1.05em; }
    .bubble.model .md h4 { font-size: 1em; }
    .bubble.model .md p { margin: 0.4em 0; }
    .bubble.model .md ul,
    .bubble.model .md ol { margin: 0.35em 0 0.45em; padding-left: 1.25em; }
    .bubble.model .md li { margin: 0.28em 0; }
    .bubble.model .md li > p { margin: 0; }
    .bubble.model .md strong { font-weight: 750; }
    .bubble.model .md em { font-style: italic; }
    .bubble.model .md hr {
      border: none;
      border-top: 1px solid var(--ai-border);
      margin: 0.85em 0;
    }
    .bubble.model .md code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9em;
      background: rgba(37, 99, 235, 0.1);
      padding: 0.05em 0.35em;
      border-radius: 5px;
    }
    .bubble.model .md pre {
      margin: 0.5em 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--ai-chip);
      overflow-x: auto;
    }
    .bubble.model .md pre code { background: transparent; padding: 0; }
    .md-caret {
      display: inline-block;
      width: 2px;
      height: 0.95em;
      margin-left: 1px;
      background: currentColor;
      vertical-align: text-bottom;
      border-radius: 1px;
      animation: mdCaret 0.9s steps(1) infinite;
    }
    @keyframes mdCaret { 50% { opacity: 0; } }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble.user.pop {
      transform-origin: 90% 120%;
      animation: bubblePop 0.5s cubic-bezier(0.18, 1.35, 0.36, 1) both;
    }
    .bubble.user.pop.has-image-only { animation-delay: 0s; }
    @keyframes bubblePop {
      0% { opacity: 0; transform: translateY(36px) scale(0.45); }
      58% { opacity: 1; transform: translateY(-8px) scale(1.07); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    #send.popping { animation: sendPop 0.42s cubic-bezier(0.2, 1.45, 0.32, 1); }
    @keyframes sendPop {
      0% { transform: scale(1); }
      32% { transform: scale(0.78); }
      68% { transform: scale(1.14); }
      100% { transform: scale(1); }
    }
    @keyframes dotSeq {
      0%, 22%, 100% { opacity: 0.28; transform: translateY(0) scale(0.85); }
      11% { opacity: 1; transform: translateY(-4px) scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bubble, .bubble.user { animation: none !important; }
      .bubble.thinking i { animation: none; opacity: 0.85; transform: none; }
    }
    .attach-preview { display: none; flex-shrink: 0; align-items: center; gap: 10px; padding: 8px 12px 0; background: var(--ai-panel); }
    .attach-preview.show { display: flex; }
    .attach-preview img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; border: 1px solid var(--ai-border); }
    .attach-preview .meta { flex: 1; font-size: 12px; color: var(--ai-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-preview button { border: none; background: var(--ai-chip); color: var(--ai-fg); border-radius: 999px; width: 28px; height: 28px; font-size: 14px; cursor: pointer; }
    .model-bar { display: none !important; }
    #modelSelect { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
    .composer {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
      padding: 8px 10px calc(78px + env(safe-area-inset-bottom, 0px));
      background: var(--ai-panel); border-top: 1px solid var(--ai-border);
    }
    .icon-btn { width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--ai-chip); color: var(--ai-fg); font-size: 18px; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    #input { flex: 1; border: 1px solid var(--ai-input-border); background: var(--ai-input-bg); color: var(--ai-fg); border-radius: 22px; padding: 11px 16px; font-size: 16px; outline: none; min-width: 0; }
    #input:focus { border-color: rgba(37, 99, 235, 0.7); }
    .send-wrap { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
    #send, #cancel { position: absolute; inset: 0; width: 44px; height: 44px; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    #send { background: #2563eb; color: #fff; z-index: 1; }
    #send:disabled { opacity: 0.45; cursor: default; }
    #cancel { background: #dc2626; color: #fff; z-index: 2; font-size: 16px; font-weight: 700; display: none; }
    #cancel.show { display: inline-flex; }
    .hidden-file { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 40; }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, 320px); background: var(--ai-drawer); color: var(--ai-fg); border-right: 1px solid var(--ai-border); transform: translateX(-105%); transition: transform 0.22s ease; z-index: 50; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0); padding-bottom: env(safe-area-inset-bottom, 0); }
    .drawer.open { transform: translateX(0); }
    .drawer-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; border-bottom: 1px solid var(--ai-border); }
    .drawer-head h3 { flex: 1; font-size: 16px; font-weight: 700; }
    .drawer-cloud { font-size: 11px; color: var(--ai-muted); padding: 0 14px 8px; }
    .drawer-cloud.on { color: #34d399; }
    .drawer-list { flex: 1; overflow-y: auto; padding: 6px 8px 16px; }
    .chat-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 12px 10px; border: none; border-radius: 12px; background: transparent; color: var(--ai-fg); cursor: pointer; margin-bottom: 4px; }
    .chat-item:active, .chat-item.active { background: rgba(37, 99, 235, 0.25); }
    .chat-item .info { flex: 1; min-width: 0; }
    .chat-item .t { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item .s { font-size: 11px; color: var(--ai-muted); margin-top: 2px; }
    .chat-item .del {
      width: 40px; height: 40px; border: none; border-radius: 10px;
      background: rgba(220, 38, 38, 0.12); color: #dc2626;
      font-size: 16px; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-item .del:active { background: rgba(220, 38, 38, 0.28); }
    .drawer-empty { text-align: center; color: var(--ai-muted); font-size: 13px; padding: 32px 16px; }
    html.embed header, html.embed .composer, html.embed .attach-preview, html.embed .model-bar { display: none !important; }
    html.embed #messages { padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
    html.embed body { padding-top: 0; }
    html.embed .welcome { margin-top: 22vh; }
  </style>
</head>
<body>
  <header>
    <button type="button" class="hdr-btn" id="btnDrawer" aria-label="對話列表">☰</button>
    <div class="titles">
      <div class="label">MapSky</div>
      <div class="title" id="headerTitle">AI 助手</div>
    </div>
    <button type="button" class="hdr-btn" id="btnNewChat" aria-label="新對話">＋</button>
  </header>
  <div id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">☁</div>
      <div class="welcome-title">MapSky AI</div>
      <div class="welcome-sub">可以問天氣、警特報<br>也可拍照或上傳圖片</div>
    </div>
  </div>
  <div class="attach-preview" id="attachPreview">
    <img id="attachThumb" alt="預覽" />
    <div class="meta" id="attachMeta"></div>
    <button type="button" id="attachClear" aria-label="移除">×</button>
  </div>
  <div class="model-bar">
    <label for="modelSelect">模型</label>
    <select id="modelSelect" aria-label="選擇 AI 模型">
      <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
      <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
      <option value="gemini-flash-latest">Gemini Flash Latest</option>
      <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
      <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
      <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
      <option value="llama-3.3-70b-versatile">Groq Llama 3.3 70B</option>
      <option value="llama-3.1-8b-instant">Groq Llama 3.1 8B Instant</option>
      <option value="gemma2-9b-it">Groq Gemma2 9B</option>
      <option value="mixtral-8x7b-32768">Groq Mixtral 8x7B</option>
      <option value="qwen/qwen3-32b">Groq Qwen3 32B</option>
    </select>
  </div>
  <form class="composer" id="form">
    <button type="button" class="icon-btn" id="btnCamera" aria-label="拍照" title="拍照">📷</button>
    <button type="button" class="icon-btn" id="btnGallery" aria-label="相簿" title="相簿／檔案">🖼</button>
    <input id="input" type="text" placeholder="輸入訊息…" autocomplete="off" enterkeyhint="send" />
    <div class="send-wrap">
      <button type="submit" id="send" aria-label="送出">↑</button>
      <button type="button" id="cancel" aria-label="取消">✕</button>
    </div>
    <input class="hidden-file" id="fileCamera" type="file" accept="image/*" capture="environment" />
    <input class="hidden-file" id="fileGallery" type="file" accept="image/*,.pdf,.txt,.md,.csv" />
  </form>
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h3>對話</h3>
      <button type="button" class="hdr-btn" id="btnDrawerNew" aria-label="新對話">＋</button>
      <button type="button" class="hdr-btn" id="btnDrawerClose" aria-label="關閉">←</button>
    </div>
    <div class="drawer-cloud" id="cloudHint">本機儲存 · 登入後可同步雲端</div>
    <div class="drawer-list" id="chatList"></div>
  </aside>
  <script>
SEE_LOCAL_FILE_FOR_FULL_CONTENT
  </script>
</body>
</html>
